name: Bundle Stats

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master
      - main
  push:
    branches:
      - master
      - main

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  compare:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: grafana/plugin-actions/bundle-size@bundle-size/v1.1.1
        with:
          # The action defaults to Node 22; the project requires 24, and it runs
          # `yarn install`, which treats an engine mismatch as a hard error.
          node-version: '24'
