# Builds and publishes a plugin archive when a version tag is pushed.
#
# The steps are spelled out explicitly (instead of using
# grafana/plugin-actions/build-plugin) so the build is auditable: frontend build,
# mage buildAll for the backend, optional signing, a tag/version consistency
# check, packaging (with SHA1 and SHA256 checksums), a blocking run of the
# Grafana plugin validator, and the GitHub release. Official actions/* use
# Dependabot-maintained major-version tags; third-party actions are pinned to
# commit SHAs. The validator is a hard gate again now that create-plugin 7.16
# replaced eslint-webpack-plugin with diagnostics-webpack-plugin, which removed
# the `braces` dependency that used to fail osv-scanner.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Exposed at job level so the signing step can test it in `if:`.
    env:
      GRAFANA_ACCESS_POLICY_TOKEN: ${{ secrets.GRAFANA_ACCESS_POLICY_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Verify tag matches package.json version
        run: |
          set -euo pipefail
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "v${PKG_VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version v${PKG_VERSION}."
            exit 1
          fi
          echo "Tag ${GITHUB_REF_NAME} matches package.json version v${PKG_VERSION}."

      - name: Install dependencies
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn install --frozen-lockfile

      - name: Build frontend
        run: npm run build

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test backend
        run: go test ./pkg/...

      - name: Scan backend dependencies for known vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          "$(go env GOPATH)/bin/govulncheck" ./pkg/...

      - name: Build backend binaries
        uses: magefile/mage-action@a662bd8c29d8106879588cfff83b2faf6e6f59db # v4.0.0
        with:
          version: latest
          args: buildAll

      - name: Sign plugin
        # Skipped until GRAFANA_ACCESS_POLICY_TOKEN is configured in the
        # repository secrets; unsigned builds are still published.
        if: ${{ env.GRAFANA_ACCESS_POLICY_TOKEN != '' }}
        run: npm run sign

      - name: Package plugin
        id: package
        run: |
          set -euo pipefail

          PLUGIN_ID=$(python3 -c "import json;print(json.load(open('dist/plugin.json'))['id'])")
          VERSION=$(python3 -c "import json;print(json.load(open('dist/plugin.json'))['info']['version'])")
          ARCHIVE="${PLUGIN_ID}-${VERSION}.zip"

          mv dist "${PLUGIN_ID}"
          zip -r "${ARCHIVE}" "${PLUGIN_ID}" >/dev/null

          # The Grafana plugin submission form ("Submit New Plugin") asks for
          # the SHA1 of the archive behind the URL, so a release that only
          # ships a .sha256 cannot be registered in the catalog. SHA-256 is kept
          # as the stronger digest for anyone already verifying against it.
          # Both are published.
          SHA1="$(sha1sum "${ARCHIVE}" | cut -d' ' -f1)"
          SHA256="$(sha256sum "${ARCHIVE}" | cut -d' ' -f1)"

          # Fail here, not at submission time, if the algorithm is ever swapped
          # again: this length check is what the v1.3.0 regression would have
          # tripped.
          if [ "${#SHA1}" -ne 40 ] || [ "${#SHA256}" -ne 64 ]; then
            echo "::error::Unexpected digest length (SHA1 ${#SHA1}, SHA256 ${#SHA256})."
            echo "The release must ship a 40-character SHA1 for plugin registration."
            exit 1
          fi

          printf '%s\n' "${SHA1}" > "${ARCHIVE}.sha1"
          printf '%s\n' "${SHA256}" > "${ARCHIVE}.sha256"

          echo "archive=${ARCHIVE}" >> "$GITHUB_OUTPUT"
          echo "plugin-id=${PLUGIN_ID}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Packaged ${ARCHIVE} ($(du -h "${ARCHIVE}" | cut -f1))"
          echo "SHA1:   ${SHA1}"
          echo "SHA256: ${SHA256}"

      - name: Validate plugin
        run: |
          npx --yes @grafana/plugin-validator@0.50.0 \
            -sourceCodeUri file://./ "${{ steps.package.outputs.archive }}"

      - name: Build release notes
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="${VERSION}" '
            /^## / {
              if (found) exit
              if (index($0, ver) > 0) { found = 1; next }
            }
            found { print }
          ' CHANGELOG.md > release-notes.md || true

          if [ ! -s release-notes.md ]; then
            echo "::warning::CHANGELOG.md has no section for version ${VERSION}; using generic release notes."
            echo "See CHANGELOG.md for the list of changes." > release-notes.md
          fi

          {
            echo "Plugin ID: \`${{ steps.package.outputs.plugin-id }}\`"
            echo "Version: \`${{ steps.package.outputs.version }}\`"
            echo
            cat release-notes.md
            echo
            echo "### Checksums"
            echo
            echo '```'
            echo "SHA1:   $(cat "${{ steps.package.outputs.archive }}.sha1")"
            echo "SHA256: $(cat "${{ steps.package.outputs.archive }}.sha256")"
            echo '```'
            echo
            echo "The SHA1 is the value the Grafana plugin submission form asks for."
          } > release-body.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "${{ steps.package.outputs.archive }}" \
            "${{ steps.package.outputs.archive }}.sha1" \
            "${{ steps.package.outputs.archive }}.sha256" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release-body.md \
            --verify-tag
