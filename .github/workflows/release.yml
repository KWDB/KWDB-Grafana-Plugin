# Builds and publishes a plugin archive when a version tag is pushed.
#
# This workflow intentionally does not use grafana/plugin-actions/build-plugin.
# That action runs the full Grafana plugin validator, whose osv-scanner step
# fails on a high severity advisory in the transitive dev dependency
# `braces@3.0.3` (GHSA-vfj7-8cjw-p6xm). The advisory has no fixed release and
# braces is only reachable through the generated webpack/eslint tooling, so it
# cannot be resolved from this repository. See
# docs/release-security-gate.md and issue #31.
#
# The metadata analyzer still runs as a hard gate, and the full validator is
# kept as an advisory step so new findings stay visible in the logs without
# blocking a release.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Exposed at job level so the signing step can test it in `if:`.
    env:
      GRAFANA_ACCESS_POLICY_TOKEN: ${{ secrets.GRAFANA_ACCESS_POLICY_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install dependencies
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn install --frozen-lockfile

      - name: Build frontend
        run: npm run build

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build backend binaries
        uses: magefile/mage-action@a662bd8c29d8106879588cfff83b2faf6e6f59db # v4.0.0
        with:
          version: latest
          args: buildAll

      - name: Sign plugin
        # Skipped until GRAFANA_ACCESS_POLICY_TOKEN is configured in the
        # repository secrets; unsigned builds are still published.
        if: ${{ env.GRAFANA_ACCESS_POLICY_TOKEN != '' }}
        run: npm run sign

      - name: Package plugin
        id: package
        run: |
          set -euo pipefail

          PLUGIN_ID=$(python3 -c "import json;print(json.load(open('dist/plugin.json'))['id'])")
          VERSION=$(python3 -c "import json;print(json.load(open('dist/plugin.json'))['info']['version'])")
          ARCHIVE="${PLUGIN_ID}-${VERSION}.zip"

          mv dist "${PLUGIN_ID}"
          zip -r "${ARCHIVE}" "${PLUGIN_ID}" >/dev/null
          sha1sum "${ARCHIVE}" | cut -d' ' -f1 > "${ARCHIVE}.sha1"

          echo "archive=${ARCHIVE}" >> "$GITHUB_OUTPUT"
          echo "plugin-id=${PLUGIN_ID}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Packaged ${ARCHIVE} ($(du -h "${ARCHIVE}" | cut -f1))"

      - name: Validate plugin metadata
        run: |
          docker run --pull=always \
            -v "$PWD/${{ steps.package.outputs.archive }}:/archive.zip" \
            grafana/plugin-validator-cli -analyzer=metadatavalid /archive.zip

      # Advisory: reports osv-scanner/semgrep findings without blocking the
      # release. See the header comment for the known `braces` advisory.
      - name: Validate plugin (advisory)
        continue-on-error: true
        run: |
          npx --yes @grafana/plugin-validator@0.50.0 \
            -sourceCodeUri file://./ "${{ steps.package.outputs.archive }}"

      - name: Build release notes
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="${VERSION}" '
            /^## / {
              if (found) exit
              if (index($0, ver) > 0) { found = 1; next }
            }
            found { print }
          ' CHANGELOG.md > release-notes.md || true

          if [ ! -s release-notes.md ]; then
            echo "See CHANGELOG.md for the list of changes." > release-notes.md
          fi

          {
            echo "Plugin ID: \`${{ steps.package.outputs.plugin-id }}\`"
            echo "Version: \`${{ steps.package.outputs.version }}\`"
            echo
            cat release-notes.md
          } > release-body.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "${{ steps.package.outputs.archive }}" \
            "${{ steps.package.outputs.archive }}.sha1" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release-body.md \
            --verify-tag
