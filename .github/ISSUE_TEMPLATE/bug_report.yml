name: Bug report
description: Report a reproducible problem with the KWDB TSDB Grafana data source
title: '[Bug]: '
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please search existing issues first and fill
        in as much detail as you can.

        **Do not include passwords, tokens, private keys, certificate contents,
        internal hostnames or IP addresses, or customer data.** Redact logs and
        screenshots before pasting them here. Report security vulnerabilities
        privately through the repository's Security tab, not in a public issue.
  - type: input
    id: grafana-version
    attributes:
      label: Grafana version
      description: The Grafana version shown in the Grafana UI.
      placeholder: 'e.g. 13.1.0'
    validations:
      required: true
  - type: input
    id: kwdb-version
    attributes:
      label: KWDB version
      description: The KWDB server version. Include the build or image tag if you know it.
      placeholder: 'e.g. 3.2.2'
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      description: The plugin version shown in Grafana or in plugin.json.
      placeholder: 'e.g. 1.4.1'
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment method
      description: How are Grafana and this plugin deployed?
      options:
        - Docker Compose (repository stack)
        - Kubernetes or Helm
        - Standalone Grafana with a manually installed plugin
        - Grafana Cloud
        - Other
    validations:
      required: true
  - type: dropdown
    id: read-only-account
    attributes:
      label: Read-only KWDB account
      description: Is the data source configured with a KWDB account that has only read privileges?
      options:
        - 'Yes'
        - 'No'
        - Not sure
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the dashboard, query, or data source settings needed to reproduce the issue. Use placeholders for sensitive values.
      placeholder: |
        1. Configure the data source with ...
        2. Run the query ...
        3. Open the panel ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead? Include the full error message if there is one.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs and errors
      description: Paste relevant Grafana, browser, or plugin logs. Redact passwords, tokens, internal hosts and IPs, certificate contents, and customer data.
      render: shell
    validations:
      required: false
