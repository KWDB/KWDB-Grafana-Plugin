apiVersion: 1

datasources:
  - name: 'KWDB TSDB'
    type: 'kwdb-datasource'
    uid: 'kwdb-tsdb'
    access: proxy
    isDefault: true
    orgId: 1
    version: 1
    editable: true
    jsonData:
      host: '$KWDB_HOST'
      port: $KWDB_PORT
      database: '$KWDB_DATABASE'
      user: '$KWDB_USER'
      sslMode: 'disable'
    secureJsonData:
      password: '$KWDB_PASSWORD'
